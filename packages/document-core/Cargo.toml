[package]
name = "catalex-document-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
imara-diff = { version = "=0.2.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
