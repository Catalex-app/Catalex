name: Tests

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - ".agents/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  lint:
    name: Lint and script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm branding:check
      - run: pnpm version:check
      - run: pnpm guide:check
      - run: pnpm exec biome ci
      - run: node --test scripts/*.test.mjs

  desktop:
    name: Desktop type checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup target add wasm32-unknown-unknown
      - run: node scripts/build-document-core.mjs
      - run: pnpm -C apps/desktop exec tsc --noEmit
      - run: pnpm -C apps/desktop electron:typecheck
      - run: pnpm -C apps/desktop test
      - run: pnpm -C apps/desktop test:electron
      - run: pnpm --filter @catalex/desktop-sidecar typecheck
      - run: pnpm --filter @catalex/desktop-sidecar test

  rust:
    name: Rust tests
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TECTONIC_DEP_BACKEND: pkg-config
      CXXFLAGS: -std=c++17
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install macOS native dependencies
        run: brew install pkg-config icu4c harfbuzz graphite2 freetype fontconfig
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            packages/document-core -> target
      - name: Test native service and integration lifecycle
        run: |
          brew_prefix="$(brew --prefix)"
          for prefix in "$brew_prefix" "$brew_prefix"/opt/{icu4c,harfbuzz,graphite2,freetype,fontconfig}; do
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            export CPATH="$prefix/include${CPATH:+:$CPATH}"
            export LIBRARY_PATH="$prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          done
          cargo test --locked --manifest-path apps/desktop/backend/Cargo.toml
      - run: cargo test --locked --manifest-path packages/document-core/Cargo.toml

  browser-core:
    name: Core browser tests
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
      - name: Run core tests
        run: pnpm -C apps/desktop exec playwright test -c playwright.config.ts --grep '@core\b' --workers=3 --reporter=line,github
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-core-failures
          path: apps/desktop/test-results/
          retention-days: 7
